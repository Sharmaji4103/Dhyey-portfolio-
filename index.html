<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhyey Patel - 3D Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-surface: #1a1a1a;
            --color-accent: #d4af37;
            --color-accent-glow: rgba(212, 175, 55, 0.5);
            --color-text: #e8e8e8;
            --color-text-dim: #9a9a9a;
            --color-border: #2a2a2a;
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Work Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Three.js Canvas Background */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        /* Cursor Follow Effect */
        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--color-accent-glow) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        /* Navigation with Glassmorphism */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--color-accent);
            text-shadow: 0 0 30px var(--color-accent-glow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .logo:hover {
            transform: scale(1.1) translateZ(20px);
            text-shadow: 0 0 50px var(--color-accent-glow), 0 0 80px var(--color-accent-glow);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links li {
            perspective: 1000px;
        }

        .nav-links a {
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--color-accent);
            transform: translateX(-50%);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px var(--color-accent-glow);
        }

        .nav-links a:hover {
            color: var(--color-accent);
            transform: translateY(-3px);
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        /* Hero Section with 3D Effects */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4rem;
            position: relative;
            overflow: hidden;
            perspective: 1500px;
        }

        .hero-bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .floating-shape {
            position: absolute;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: morphing 20s ease-in-out infinite;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: 10%;
            right: 10%;
            animation: morphing 20s ease-in-out infinite, float-1 15s ease-in-out infinite;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: 20%;
            left: 15%;
            animation: morphing 25s ease-in-out infinite reverse, float-2 18s ease-in-out infinite;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            right: 20%;
            animation: morphing 15s ease-in-out infinite, float-3 12s ease-in-out infinite;
        }

        @keyframes morphing {
            0%, 100% {
                border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            }
            25% {
                border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%;
            }
            50% {
                border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%;
            }
            75% {
                border-radius: 33% 67% 58% 42% / 63% 68% 32% 37%;
            }
        }

        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(40px, -40px) rotate(90deg) scale(1.1); }
            50% { transform: translate(-30px, 30px) rotate(180deg) scale(0.9); }
            75% { transform: translate(50px, 20px) rotate(270deg) scale(1.05); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-50px, -30px) rotate(120deg); }
            66% { transform: translate(30px, 40px) rotate(240deg); }
        }

        @keyframes float-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, -50px) scale(1.2); }
        }

        .hero-content {
            max-width: 1200px;
            position: relative;
            z-index: 1;
            transform-style: preserve-3d;
        }

        .hero-label {
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 2rem;
            font-weight: 600;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border: 1px solid var(--color-accent);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            background: rgba(212, 175, 55, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(60px) translateZ(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(3.5rem, 10vw, 8rem);
            font-weight: 300;
            line-height: 1;
            margin-bottom: 2rem;
            letter-spacing: -3px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
            transform-style: preserve-3d;
        }

        .hero h1 .name {
            display: block;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent) 0%, #f0d98c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both, glow 3s ease-in-out infinite;
            position: relative;
        }

        .hero h1 .title {
            display: block;
            font-size: 0.5em;
            color: var(--color-text-dim);
            margin-top: 1rem;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 20px var(--color-accent-glow));
            }
            50% {
                filter: drop-shadow(0 0 40px var(--color-accent-glow)) drop-shadow(0 0 60px var(--color-accent-glow));
            }
        }

        .hero-description {
            font-size: 1.3rem;
            line-height: 1.8;
            color: var(--color-text-dim);
            max-width: 700px;
            margin-bottom: 3rem;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s both;
        }

        .hero-cta {
            display: flex;
            gap: 2rem;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both;
        }

        .btn {
            padding: 1.2rem 3rem;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent) 0%, #f0d98c 100%);
            color: var(--color-bg);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            background: rgba(10, 10, 10, 0.5);
            color: var(--color-text);
            border: 2px solid var(--color-accent);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.3);
        }

        /* Section Styles with 3D Cards */
        section {
            padding: 10rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .section-header {
            margin-bottom: 6rem;
            position: relative;
            transform-style: preserve-3d;
        }

        .section-label {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 1rem;
            font-weight: 600;
            display: inline-block;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 300;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--color-text) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* About Section with 3D Stats */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6rem;
            align-items: start;
        }

        .about-text {
            font-size: 1.15rem;
            line-height: 2;
            color: var(--color-text-dim);
        }

        .about-text p {
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        .about-text p:nth-child(1) { animation-delay: 0.2s; }
        .about-text p:nth-child(2) { animation-delay: 0.4s; }
        .about-text p:nth-child(3) { animation-delay: 0.6s; }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
        }

        .stat {
            padding: 2.5rem;
            background: rgba(26, 26, 26, 0.5);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .stat::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .stat:hover {
            transform: translateY(-15px) rotateX(5deg) rotateY(5deg);
            border-color: var(--color-accent);
            box-shadow: 0 30px 80px rgba(212, 175, 55, 0.3);
        }

        .stat:hover::before {
            opacity: 1;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent) 0%, #f0d98c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            display: block;
        }

        .stat-label {
            font-size: 0.95rem;
            color: var(--color-text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Skills Section with 3D Cards */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .skill-card {
            background: rgba(26, 26, 26, 0.5);
            padding: 3rem;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--color-accent) 0%, #f0d98c 100%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .skill-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.6s ease;
        }

        .skill-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 30px 80px rgba(212, 175, 55, 0.3);
        }

        .skill-card:hover::before {
            transform: scaleX(1);
        }

        .skill-card:hover::after {
            transform: translate(-50%, -50%) scale(1);
        }

        .skill-category {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .skill-list {
            list-style: none;
        }

        .skill-list li {
            font-size: 1.05rem;
            color: var(--color-text-dim);
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .skill-list li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            transition: all 0.3s ease;
        }

        .skill-list li:hover {
            color: var(--color-text);
            transform: translateX(10px);
        }

        .skill-list li:hover::before {
            transform: scale(1.5);
        }

        /* Projects Section */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 3rem;
        }

        .project-card {
            background: rgba(26, 26, 26, 0.5);
            border: 1px solid var(--color-border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            transform-style: preserve-3d;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 1;
            pointer-events: none;
        }

        .project-card:hover {
            transform: translateY(-20px) scale(1.02);
            border-color: var(--color-accent);
            box-shadow: 0 40px 100px rgba(212, 175, 55, 0.4);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-image {
            width: 100%;
            height: 240px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(42, 42, 42, 0.5) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 3rem;
            color: var(--color-accent);
            font-weight: 700;
            position: relative;
            overflow: hidden;
        }
