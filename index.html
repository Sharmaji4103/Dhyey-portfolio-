<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhyey Patel - Creative Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --noir: #0d0d0d;
            --charcoal: #1a1a1a;
            --smoke: #2d2d2d;
            --silver: #c0c0c0;
            --pearl: #f5f5f5;
            --gold: #d4a574;
            --accent: #8b7355;
            --highlight: #e8d4b8;
            
            --font-display: 'Playfair Display', serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-body);
            background: var(--noir);
            color: var(--pearl);
            line-height: 1.6;
            overflow-x: hidden;
            cursor: none;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease;
        }

        .cursor.expand {
            width: 60px;
            height: 60px;
            border-color: var(--highlight);
        }

        /* Three.js Canvas */
        #canvas-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--noir);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
        }

        .loader-number {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold) 0%, var(--highlight) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: countUp 2s ease-out forwards;
        }

        @keyframes countUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader-text {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--silver);
            margin-top: 2rem;
            animation: fadeIn 2s ease-in-out infinite alternate;
        }

        @keyframes fadeIn {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* Scroll Progress */
        .scroll-indicator {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--highlight));
            z-index: 9999;
            transform-origin: left;
            transition: transform 0.1s ease;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 3rem 6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(13, 13, 13, 0.95) 0%, transparent 100%);
            backdrop-filter: blur(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        nav.scrolled {
            padding: 2rem 6rem;
            background: rgba(13, 13, 13, 0.8);
            border-bottom: 1px solid rgba(212, 165, 116, 0.2);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--highlight) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav-menu {
            display: flex;
            gap: 4rem;
            list-style: none;
        }

        .nav-menu a {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--silver);
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-menu a:hover {
            color: var(--gold);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 6rem;
            overflow: hidden;
        }

        .hero-content {
            max-width: 1400px;
            position: relative;
            z-index: 1;
        }

        .hero-subtitle {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2rem;
            opacity: 0;
            animation: slideUp 1s ease forwards 0.5s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 900;
            line-height: 0.9;
            margin-bottom: 3rem;
            letter-spacing: -4px;
            opacity: 0;
            animation: slideUp 1s ease forwards 0.7s;
        }

        .hero-title .gradient-text {
            background: linear-gradient(135deg, var(--gold) 0%, var(--highlight) 50%, var(--pearl) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .hero-title .outline-text {
            color: transparent;
            -webkit-text-stroke: 2px var(--gold);
            display: block;
        }

        .hero-description {
            font-size: 1.4rem;
            line-height: 1.8;
            color: var(--silver);
            max-width: 700px;
            margin-bottom: 4rem;
            opacity: 0;
            animation: slideUp 1s ease forwards 0.9s;
        }

        .hero-cta {
            display: flex;
            gap: 2rem;
            opacity: 0;
            animation: slideUp 1s ease forwards 1.1s;
        }

        .cta-button {
            padding: 1.5rem 3.5rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: none;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .cta-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--accent) 100%);
            color: var(--noir);
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }

        .cta-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .cta-primary:hover::before {
            left: 100%;
        }

        .cta-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(212, 165, 116, 0.5);
        }

        .cta-secondary {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            clip-path: polygon(0% 0%, 90% 0%, 100% 100%, 10% 100%);
        }

        .cta-secondary:hover {
            background: rgba(212, 165, 116, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(212, 165, 116, 0.3);
        }

        /* Floating Numbers Background */
        .floating-numbers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.1;
            pointer-events: none;
        }

        .floating-number {
            position: absolute;
            font-family: var(--font-display);
            font-size: 15rem;
            font-weight: 900;
            color: var(--gold);
            opacity: 0.05;
            animation: float-vertical 20s ease-in-out infinite;
        }

        .floating-number:nth-child(1) {
            top: 10%;
            right: 10%;
            animation-delay: 0s;
        }

        .floating-number:nth-child(2) {
            bottom: 20%;
            left: 5%;
            animation-delay: 5s;
        }

        .floating-number:nth-child(3) {
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float-vertical {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-100px) rotate(10deg);
            }
        }

        /* Sections */
        section {
            min-height: 100vh;
            padding: 10rem 6rem;
            position: relative;
            display: flex;
            align-items: center;
        }

        .section-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2rem;
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border: 2px solid var(--gold);
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 4rem;
            letter-spacing: -3px;
        }

        .section-title .outline {
            color: transparent;
            -webkit-text-stroke: 2px var(--gold);
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8rem;
            align-items: start;
        }

        .about-text {
            font-size: 1.3rem;
            line-height: 2;
            color: var(--silver);
        }

        .about-text p {
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .about-text p.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
        }

        .stat-item {
            padding: 3rem;
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.05) 0%, transparent 100%);
            border: 1px solid rgba(212, 165, 116, 0.2);
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(50px);
            opacity: 0;
        }

        .stat-item.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .stat-item:hover {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, transparent 100%);
            border-color: var(--gold);
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(212, 165, 116, 0.3);
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold) 0%, var(--highlight) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .stat-label {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--silver);
        }

        /* Skills Section */
        #skills {
            background: linear-gradient(180deg, var(--noir) 0%, var(--charcoal) 50%, var(--noir) 100%);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 3rem;
        }

        .skill-card {
            padding: 4rem;
            background: rgba(45, 45, 45, 0.3);
            border: 1px solid rgba(212, 165, 116, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: translateY(80px);
            opacity: 0;
        }

        .skill-card.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--highlight));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .skill-card:hover::before {
            transform: scaleX(1);
        }

        .skill-card:hover {
            border-color: var(--gold);
            transform: translateY(-15px);
            box-shadow: 0 40px 100px rgba(212, 165, 116, 0.4);
        }

        .skill-number {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 900;
            position: absolute;
            top: -2rem;
            right: 2rem;
            color: transparent;
            -webkit-text-stroke: 1px rgba(212, 165, 116, 0.1);
            z-index: 0;
        }

        .skill-category {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .skill-list {
            list-style: none;
            position: relative;
            z-index: 1;
        }

        .skill-list li {
            font-size: 1.1rem;
            color: var(--silver);
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .skill-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--gold);
            transition: transform 0.3s ease;
        }

        .skill-list li:hover {
            color: var(--pearl);
            transform: translateX(10px);
        }

        .skill-list li:hover::before {
            transform: translateX(5px);
        }

        /* Experience Section */
        .experience-container {
            position: relative;
        }

        .experience-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--gold) 0%, var(--accent) 50%, var(--gold) 100%);
            transform: translateX(-50%);
        }

        .experience-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6rem;
            margin-bottom: 8rem;
            position: relative;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .experience-item.visible {
            opacity: 1;
        }

        .experience-item:nth-child(even) .experience-content {
            order: 2;
        }

        .experience-item::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 3rem;
            width: 20px;
            height: 20px;
            background: var(--gold);
            border: 4px solid var(--noir);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 0 4px var(--gold), 0 0 30px rgba(212, 165, 116, 0.6);
            z-index: 2;
        }

        .experience-year {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px var(--gold);
            line-height: 1;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .experience-item:hover .experience-year {
            -webkit-text-stroke: 2px var(--highlight);
            transform: scale(1.1);
        }

        .experience-content {
            padding: 3rem;
            background: rgba(45, 45, 45, 0.3);
            border: 1px solid rgba(212, 165, 116, 0.2);
            backdrop-filter: blur(10px);
            clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 100%);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .experience-content:hover
